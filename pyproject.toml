[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-vlm-bench"
version = "0.1.0"
description = "Reproducible multimodal vLLM serving benchmarks on Google Colab A100"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1.0", "ijson>=3.3,<4", "psutil>=5.9,<8", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
datasets = ["PyMuPDF>=1.24,<2", "pyarrow>=15,<25"]
gpu = ["vllm==0.29.0"]
[project.scripts]
vlmbench = "vlmbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

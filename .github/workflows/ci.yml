name: cpu-contracts
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision safetensors
          python -m pip install -e '.[dev]'
      - name: Syntax
        run: python -m compileall -q src tests scripts
      - name: Bash syntax
        run: bash -n scripts/colab_controller.sh
      - name: Unit tests
        run: pytest -q
      - name: Plan
        run: python -m vlmbench.cli plan --config configs/a100_campaign.json
      - name: Seven-arm research plans (CPU only)
        run: |
          python -m vlmbench.cli methods-plan --config configs/a100_qwen_7methods_pilot.json
          python -m vlmbench.cli methods-plan --config configs/a100_qwen_7methods_full.json
